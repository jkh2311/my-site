name: Scheduled Pages Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC; new posts KST 2026-10-08 14:20,18:20,22:20 and 2026-10-09 02:20,06:20.
    # GitHub scheduled runs may be delayed; workflow_dispatch provides manual fallback.
    - cron: '20 7 7 10 *'
    - cron: '20 11 7 10 *'
    - cron: '20 15 7 10 *'
    - cron: '20 19 7 10 *'
    - cron: '20 5 8 10 *'
    - cron: '20 9 8 10 *'
    - cron: '20 13 8 10 *'
    - cron: '20 17 8 10 *'
    - cron: '20 21 8 10 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install beautifulsoup4
      - name: Build scheduled public site
        run: python scripts/build_scheduled_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
