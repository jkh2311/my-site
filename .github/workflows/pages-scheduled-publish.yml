name: Scheduled Pages Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 16 7 10 *'
      timezone: 'Asia/Seoul'
    - cron: '20 20 7 10 *'
      timezone: 'Asia/Seoul'
    - cron: '20 0 8 10 *'
      timezone: 'Asia/Seoul'
    - cron: '20 4 8 10 *'
      timezone: 'Asia/Seoul'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install beautifulsoup4
      - name: Build scheduled public site
        run: python scripts/build_scheduled_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
