name: Scheduled Pages Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # KST: 18th 2026-10-12 14:55, 19th 18:50, 20th 22:35.
    # Cron may be delayed; hourly retries catch missed deployments.
    - cron: '55 5 12 10 *'
    - cron: '50 9 12 10 *'
    - cron: '35 13 12 10 *'
    - cron: '12 6,10,14 12 10 *'
    # Refresh trends throughout the day, including after the article launch date.
    - cron: '17 0,4,8,12,16,20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install beautifulsoup4
      - name: Build scheduled public site
        run: python scripts/build_scheduled_site.py
      - name: Fetch trending search keywords
        run: python scripts/fetch_trending_keywords.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
