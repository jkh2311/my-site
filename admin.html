<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 글쓰기 | 한이네생활정보</title><link rel="stylesheet" href="/style.css?v=60"></head><body>
<header class="site-header"><div class="container header-inner"><a class="logo logo-image" href="/index.html" aria-label="한이네생활정보 홈"><img src="/images/hanine-header-logo.png" alt="한이네생활정보 | 오늘도 하나 알아갑니다"></a><nav class="main-nav"><a href="/index.html">사이트로 돌아가기</a></nav></div></header>
<main><section class="page-hero"><div class="container"><p class="section-label">ADMIN</p><h1>게시글 관리</h1><p>로그인 후 새 글을 발행하거나 기존 게시글을 수정·삭제할 수 있습니다.</p></div></section><section class="section"><div class="container">
<div class="admin-note"><strong>V5.9 자동 발행:</strong> 발행하면 서버가 GitHub 저장소에 게시글을 커밋하고 sitemap.xml과 게시글 검색 목록을 함께 갱신합니다. GitHub 토큰은 이 HTML에 저장하지 않습니다.</div>
<div class="admin-card" id="login-card"><h2>관리자 로그인</h2><div class="form-grid"><div class="form-field"><label>관리자 API 주소</label><input id="api" placeholder="https://haninelife-admin.계정.workers.dev"></div><div class="form-field"><label>관리자 비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div></div><div class="form-actions"><button class="btn btn-primary" id="login">로그인</button></div><div class="form-status" id="login-status"></div></div>
<div class="admin-card" id="editor-card" hidden style="margin-top:20px"><div class="form-actions" style="margin-top:0"><button class="btn btn-primary" id="new">+ 새 게시글</button><select id="existing" style="min-width:300px;padding:11px;border:1px solid #cfd8e6;border-radius:10px"><option value="">기존 게시글 선택</option></select><button class="btn btn-secondary" id="load">불러오기</button></div><hr style="margin:22px 0;border:0;border-top:1px solid #e5e7eb">
<div class="form-grid"><div class="form-field"><label>게시글 제목</label><input id="title" placeholder="제목 끝에는 총정리"></div><div class="form-field"><label>파일명</label><input id="slug" readonly placeholder="새 글 발행 시 자동 생성"><small>새 게시글은 post-날짜-시간 형식으로 자동 생성됩니다.</small></div><div class="form-field"><label>카테고리</label><select id="cat"><option value="admin">생활·행정</option><option value="support">지원·복지</option><option value="finance">금융·보험</option><option value="tips">생활팁</option></select></div><div class="form-field"><label>기준일</label><input id="date" type="date"></div><div class="form-field full"><label>검색 설명</label><input id="desc" maxlength="160"></div></div>
<h2 style="margin-top:24px">본문</h2><div class="admin-toolbar"><button class="btn btn-secondary" data-cmd="bold">굵게</button><button class="btn btn-secondary" data-cmd="formatBlock" data-val="h2">큰 제목</button><button class="btn btn-secondary" data-cmd="formatBlock" data-val="h3">작은 제목</button><button class="btn btn-secondary" id="link">링크</button></div><div id="body" class="admin-editor" contenteditable="true"><h2>핵심 내용</h2><p>여기에 내용을 작성하세요.</p></div>
<div class="form-actions"><button class="btn btn-primary" id="publish">GitHub에 바로 발행</button><button class="btn btn-secondary" id="draft">브라우저 임시저장</button><button class="btn btn-secondary" id="delete" hidden style="border-color:#b91c1c;color:#b91c1c">게시글 삭제</button></div><div class="form-status" id="status"></div></div>
</div></section></main><footer class="site-footer"><div class="container copyright">© 2026 한이네생활정보.</div></footer>
<script>
const $=x=>document.getElementById(x); let mode='new', current=''; $('date').value=new Date().toISOString().slice(0,10);
function st(t,login=false){const e=$(login?'login-status':'status');e.style.display='block';e.textContent=t}
function cfg(){return {api:$('api').value.trim().replace(/\/$/,''),password:$('pw').value}}
async function call(path,opt={}){const c=cfg(); const r=await fetch(c.api+path,{...opt,headers:{'Content-Type':'application/json','X-Admin-Password':c.password,...(opt.headers||{})}}); const j=await r.json().catch(()=>({})); if(!r.ok)throw new Error(j.error||'요청 실패');return j}
$('login').onclick=async()=>{try{const j=await call('/api/posts');localStorage.setItem('hani-admin-api',$('api').value.trim());$('editor-card').hidden=false;fill(j.posts);st('로그인 성공',true)}catch(e){st('로그인 실패: '+e.message,true)}};
function fill(a){$('existing').innerHTML='<option value="">기존 게시글 선택</option>'+a.map(x=>`<option value="${x.slug}">${x.title}</option>`).join('')}
$('load').onclick=async()=>{if(!$('existing').value)return;try{const j=await call('/api/post?slug='+encodeURIComponent($('existing').value));mode='edit';current=j.slug;$('title').value=j.title||'';$('slug').value=j.slug;$('slug').disabled=true;$('desc').value=j.description||'';$('cat').value=j.category||'admin';$('body').innerHTML=j.articleHtml||'';$('delete').hidden=false;st('기존 게시글을 불러왔습니다. 수정하거나 삭제할 수 있습니다.')}catch(e){st(e.message)}};
function autoSlug(){const d=new Date();const z=n=>String(n).padStart(2,'0');return `post-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;}
$('new').onclick=()=>{mode='new';current='';$('delete').hidden=true;$('title').value='';$('slug').value=autoSlug();$('slug').disabled=false;$('desc').value='';$('body').innerHTML='<h2>핵심 내용</h2><p>여기에 내용을 작성하세요.</p>';st('새 게시글 작성 모드입니다. 파일명은 자동 생성됩니다.')};
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.val||null);$('body').focus()});$('link').onclick=()=>{const u=prompt('링크 주소');if(u)document.execCommand('createLink',false,u)};
$('draft').onclick=()=>{localStorage.setItem('hani-admin-draft',JSON.stringify(form()));st('이 브라우저에 임시저장했습니다.')};
function form(){if(mode==='new'&&!$('slug').value)$('slug').value=autoSlug();return{mode,originalSlug:current,title:$('title').value.trim(),slug:$('slug').value.trim(),category:$('cat').value,date:$('date').value,description:$('desc').value.trim(),bodyHtml:$('body').innerHTML}}
$('delete').onclick=async()=>{if(mode!=='edit'||!current)return st('삭제할 기존 게시글을 먼저 불러오세요.');const title=$('title').value.trim()||current;if(!confirm('정말 삭제할까요?\n\n'+title+'\n\n삭제하면 GitHub의 게시글 파일, 게시글 목록, 검색 목록, sitemap.xml에서 함께 제거됩니다.'))return;try{$('delete').disabled=true;$('publish').disabled=true;st('GitHub에서 게시글을 삭제 중입니다...');await call('/api/delete',{method:'POST',body:JSON.stringify({slug:current})});const x=await call('/api/posts');fill(x.posts);mode='new';current='';$('title').value='';$('slug').value='';$('slug').disabled=false;$('desc').value='';$('body').innerHTML='<h2>핵심 내용</h2><p>여기에 내용을 작성하세요.</p>';$('delete').hidden=true;st('게시글 삭제 완료! 검색 목록과 sitemap에서도 제거했습니다.')}catch(e){st('삭제 실패: '+e.message)}finally{$('delete').disabled=false;$('publish').disabled=false}};
$('publish').onclick=async()=>{const d=form();if(!d.title)return st('게시글 제목을 입력하세요.');if(!confirm(mode==='new'?'새 게시글을 GitHub에 바로 발행할까요?':'수정 내용을 GitHub에 바로 저장할까요?'))return;try{$('publish').disabled=true;st('GitHub에 저장 중입니다...');const j=await call('/api/publish',{method:'POST',body:JSON.stringify(d)});st('발행 완료! '+j.url);const x=await call('/api/posts');fill(x.posts);mode='edit';current=j.slug;$('slug').disabled=true}catch(e){st('발행 실패: '+e.message)}finally{$('publish').disabled=false}};
$('api').value=localStorage.getItem('hani-admin-api')||'';
</script></body></html>
