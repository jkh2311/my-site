<script>
(function(){
  let ARTICLE_INDEX = [];
  fetch('/article-index.json?v=' + Date.now(), {cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(Array.isArray(d)) ARTICLE_INDEX=d}).catch(()=>{});
  const input = document.getElementById('site-article-search');
  const btn = document.getElementById('site-article-search-btn');
  const results = document.getElementById('site-article-search-results');
  const wrap = document.getElementById('article-search-wrap');
  if (!input || !btn || !results || !wrap) return;
  function esc(str){return String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function runSearch(){
    const q=input.value.trim().toLowerCase();
    if(q.length<2){results.hidden=false;results.innerHTML='<div class="article-search-message">2글자 이상 입력해주세요.</div>';return;}
    const found=ARTICLE_INDEX.filter(item=>((item.title||'')+' '+(item.description||'')+' '+(item.category||'')).toLowerCase().includes(q));
    results.hidden=false;
    if(!found.length){results.innerHTML='<div class="article-search-message">해당 게시글을 찾지 못했습니다.</div>';return;}
    results.innerHTML=found.map(item=>'<a class="article-search-result" href="'+esc(item.url)+'"><span class="article-search-result-cat">'+esc(item.category||'생활정보')+'</span><strong>'+esc(item.title)+'</strong>'+(item.description?'<small>'+esc(item.description)+'</small>':'')+'</a>').join('');
  }
  btn.addEventListener('click',runSearch);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});
  input.addEventListener('input',()=>{if(input.value.trim().length>=2)runSearch();else if(!input.value.trim()){results.hidden=true;results.innerHTML='';}});
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))results.hidden=true;});
})();
</script>
