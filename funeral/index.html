ument.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(t)}document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('tr').forEach(function(tr){var th=tr.querySelector('th');var td=tr.querySelector('td');if(!th||!td)return;var key=clean(th.textContent);if(key==='주소'||key==='전화번호'||key==='대표전화'||key==='연락처'){var clone=td.cloneNode(true);clone.querySelectorAll('button,.info-copy-btn').forEach(function(x){x.remove()});var val=clean(clone.textContent);addBtn(td,val,key)}});document.querySelectorAll('p').forEach(function(p){var st=p.querySelector('strong,b');if(!st)return;var k=clean(st.textContent).replace(/:$/,'');if(k==='주소'||k==='전화번호'||k==='대표전화'||k==='연락처'){var val=clean(p.textContent.replace(st.textContent,''));addBtn(p,val,k)}})})})();</script><script id="funeral-search-v122">(function(){
const input=document.getElementById('funeralSearchInput');
const box=document.getElementById('funeralSearchResults');
if(!input||!box)return;
let data=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function hi(text,q){const safe=esc(text); if(!q)return safe; const idx=String(text).toLowerCase().indexOf(q.toLowerCase()); if(idx<0)return safe; return esc(text.slice(0,idx))+'<mark>'+esc(text.slice(idx,idx+q.length))+'</mark>'+esc(text.slice(idx+q.length));}
function close(){box.classList.remove('show');input.setAttribute('aria-expanded','false');}
function render(){const q=input.value.trim(); if(q.length<2){close();box.innerHTML='';return;} const matched=data.filter(x=>x.name.includes(q)||x.title.includes(q)).slice(0,12); box.innerHTML='<div class="fh-search-count">검색 결과 '+matched.length+'개</div>'+(matched.length?matched.map(x=>'<a class="fh-search-result" role="option" href="'+esc(x.url)+'"><strong>'+hi(x.name,q)+'</strong>'+(x.address?'<small>'+esc(x.address)+'</small>':'')+'</a>').join(''):'<div class="fh-search-empty">일치하는 장례식장이 없습니다.</div>'); box.classList.add('show');input.setAttribute('aria-expanded','true');}
fetch('/funeral/funeral-search-index.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{data=Array.isArray(j)?j:[];}).catch(()=>{});
input.addEventListener('input',render); input.addEventListener('focus',render);
document.addEventListener('click',e=>{if(!e.target.closest('.fh-search'))close();});
input.addEventListener('keydown',e=>{if(e.key==='Escape')close(); if(e.key==='Enter'){const first=box.querySelector('.fh-search-result'); if(first){e.preventDefault(); location.href=first.href;}}});
})();</script></body></html>
