;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(v).then(done).catch(function(){fallback(v,done)})}else fallback(v,done)});el.appendChild(b)}function fallback(v,done){var t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(t)}document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('tr').forEach(function(tr){var th=tr.querySelector('th');var td=tr.querySelector('td');if(!th||!td)return;var key=clean(th.textContent);if(key==='주소'||key==='전화번호'||key==='대표전화'||key==='연락처'){var clone=td.cloneNode(true);clone.querySelectorAll('button,.info-copy-btn').forEach(function(x){x.remove()});var val=clean(clone.textContent);addBtn(td,val,key)}});document.querySelectorAll('p').forEach(function(p){var st=p.querySelector('strong,b');if(!st)return;var k=clean(st.textContent).replace(/:$/,'');if(k==='주소'||k==='전화번호'||k==='대표전화'||k==='연락처'){var val=clean(p.textContent.replace(st.textContent,''));addBtn(p,val,k)}})})})();</script></body></html>
